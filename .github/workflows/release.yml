name: Release module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Stamp version and download URL into module.json
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME;
            const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
            m.version = tag.replace(/^v/, "");
            m.download = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/module.zip`;
            fs.writeFileSync("module.json", JSON.stringify(m, null, 2) + "\n");
          '

      - run: npm run build

      - name: Package module
        run: zip -r module.zip module.json dist assets templates README.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
